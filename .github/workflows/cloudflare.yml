name: Que Cloudflare publique la web

# POR QUE EXISTE (1-oct-2026). La web de cyelitelab.com la sirve el Worker `cy-elite-lab`,
# y Cloudflare la reconstruye sola con cada push a master («Workers Builds»). El 1-oct,
# desde las 16:35 UTC, Cloudflare dejo de enterarse de los push: los commits llegaban,
# «Publicar web (Pages)» salia en verde y la web seguia sirviendo la de las 15:41. Mas de
# cuatro horas sin que nadie lo viera. El verde no probaba nada.
#
# QUE HACE. Con cada push a master mira si Cloudflare lo recogio: su comprobacion
# («Workers Builds: cy-elite-lab») aparece en el commit a los pocos segundos y termina en
# un par de minutos. Si no aparece en 90 segundos, termina mal o no termina en 8 minutos,
# le pide al motor el build a mano («La web en Cloudflare», accion reconstruir: el MISMO
# disparador de Cloudflare, sin inventar configuracion). El motor lo comprueba en la web y
# avisa al celular si sigue sin ponerse al dia.
#
# Aqui los minutos de Actions son gratis (repo publico); en el motor solo se gastan cuando
# Cloudflare falla. La copia de este fichero vive en el motor: herramientas/web/.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  checks: read
  contents: read

# El build de Cloudflare publica siempre lo ultimo de master: si llega otro push mientras
# se mira este, se mira el nuevo y este se deja.
concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Esperar a que Cloudflare recoja el push
        env:
          GH_TOKEN: ${{ github.token }}
          TK: ${{ secrets.MOTOR_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          estado=""
          for i in $(seq 1 48); do
            sleep 10
            estado=$(gh api "repos/$REPO/commits/$SHA/check-suites" \
              -q '[.check_suites[] | select(.app.slug=="cloudflare-workers-and-pages") | "\(.status)/\(.conclusion)"] | first // ""' || echo "")
            if [ -z "$estado" ] && [ "$i" -ge 9 ]; then
              echo "Cloudflare no ha recogido el push en 90 s."
              break
            fi
            case "$estado" in
              completed/success) echo "Cloudflare lo publico ($estado, a los $((i * 10)) s)."; exit 0 ;;
              completed/*) echo "El build de Cloudflare termino mal: $estado"; break ;;
            esac
          done
          case "$estado" in
            ""|completed/*) ;;
            *) echo "Cloudflare no termino en 8 minutos: $estado" ;;
          esac
          if [ -z "${TK:-}" ]; then
            echo "::error::falta el secreto MOTOR_DISPATCH_TOKEN"
            exit 1
          fi
          C=$(curl -sL -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TK" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/cesaryin/cy-elite-motor/actions/workflows/web-cloudflare.yml/dispatches" \
            -d '{"ref":"main","inputs":{"accion":"reconstruir"}}' || echo "000")
          echo "Pedido al motor el build a mano -> $C (204 = pedido)"
          [ "$C" = "204" ] || { echo "::error::no se pudo pedir el build al motor ($C)"; exit 1; }
