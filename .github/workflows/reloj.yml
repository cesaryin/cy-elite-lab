name: Reloj del dia (dispara el motor)

# ===========================================================================
# POR QUE EXISTE ESTE WORKFLOW
#
# Los eventos `schedule` de GitHub no son fiables en el repo PRIVADO del motor.
# Medido sobre 143 ejecuciones del refresco del LAB desde el 27 de julio:
#
#     27-jul a  6-ago .... llegaban con 170-240 min de retraso
#      7-ago a 25-ago .... 37-80 min de media (el mejor tramo)
#     26-ago en adelante .. 93-300 min de media, con picos de 11 HORAS
#
# Es decir: el LAB nunca ha sido puntual, y desde finales de agosto directamente
# no sirve. Un refresco pensado para las 10:23 que llega a las 14:00 se pierde
# los juegos de mediodia, que es justo para lo que existia.
#
# LA SALIDA. El reloj no puede vivir en el motor porque dormir se FACTURA: cubrir
# de 10:00 a 21:10 CT son ~690 min al dia, y la cuota gratis del repo privado es
# ~66 min al dia. Serian unos 150 $/mes.
#
# Pero ESTE repo es PUBLICO, y los repos publicos tienen minutos de Actions
# ilimitados y gratis. Aqui un job que duerme once horas no cuesta nada.
#
# COMO FUNCIONA. Arranca una vez al dia, duerme hasta cada hora objetivo y va
# disparando por `workflow_dispatch` los workflows del motor —que SIEMPRE son
# puntuales, a diferencia de los `schedule`—. Como un job no puede pasar de 6
# horas, al acercarse a las 5 se dispara a si mismo con el testigo (`desde`) y
# el siguiente tramo sigue donde lo dejo.
#
# LAS TANDAS DEL SISTEMA VIVO (14-sep-2026). Ademas de sus objetivos fijos, el
# reloj mira cada 10 minutos el plan del dia que publica el motor
# (data/plan_tandas_<fecha>.json) y lanza tanda.yml a las horas que ese plan
# eligio. Con la misma llave: no hizo falta ni Cloudflare ni una llave nueva.
#
# LOS REFRESCOS DEL LAB TAMBIEN LOS PONE EL PLAN (14-sep-2026). Ya no van a las 4
# horas fijas: uno ~45 min antes de cada bloque de partidos ("min_reloj_lab"). Si un
# dia no hay plan, el reloj los lanza a las horas de siempre (minutos 140, 320, 500
# y 680) para que la web no se quede parada.
#
# QUE HACE FALTA: el secreto MOTOR_DISPATCH_TOKEN, un token fine-grained con
# permiso "Actions: write" sobre cy-elite-motor Y sobre cy-elite-lab (lo
# segundo, para poder pasarse el testigo a si mismo). Nada mas.
# ===========================================================================

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Minutos desde las 13:00 UTC a partir de los que seguir (uso interno)"
        required: false
        # -1 Y NO 0 (arreglado el 4-sep-2026). El filtro del bucle es
        # "$MIN -le $DESDE -> saltar", porque el relevo pasa MIN-1 para que el
        # objetivo MIN todavia entre. Con el valor por defecto en 0 se cumplia
        # 0 -le 0 y el reloj se saltaba SIEMPRE su primer objetivo, que es
        # justo el RUN de los picks. Con -1 no se salta ninguno.
        default: "-1"
      espera:
        description: "1 = no dispares nada, solo espera al ancla siguiente (uso interno)"
        required: false
        default: "0"
  schedule:
    # EL ENCENDIDO ES LO UNICO QUE FALLA (medido el 3-sep-2026). Los objetivos
    # del reloj salen con 0.0 min de desvio --6 de 6 exactos--, pero el cron que
    # DESPIERTA al reloj llego una sola vez y con 237 minutos de retraso.
    #
    # Por eso se ponen VARIOS. GitHub retrasa o se salta los cron cuando tiene
    # carga, pero rara vez falla a todos seguidos. El primero que entre arranca
    # la jornada; los siguientes se encuentran el trabajo hecho y se saltan los
    # objetivos ya pasados, asi que no duplican nada.
    #
    # Todos ANTES de las 13:00 UTC, que es el ancla: asi el objetivo del RUN
    # (minuto 0 = 8:00 AM CT) todavia esta por delante cuando el reloj despierta.
    - cron: "35 12 * * *"
    - cron: "45 12 * * *"
    - cron: "52 12 * * *"
    - cron: "58 12 * * *"

permissions:
  contents: read

# EL ULTIMO RELOJ MANDA. Si se relanza el run de picks a media jornada —cosa que
# pasa cuando se republica la web— el reloj nuevo cancela al viejo y arranca
# limpio: al recorrer sus objetivos se salta los que ya pasaron, asi que no hay
# disparos repetidos. Con `false` se habrian quedado dos relojes en cola pisandose.
concurrency:
  group: reloj-del-dia
  cancel-in-progress: true

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Disparar el motor a sus horas
        env:
          TK: ${{ secrets.MOTOR_DISPATCH_TOKEN }}
          DESDE: ${{ github.event.inputs.desde }}
          MODO_ESPERA: ${{ github.event.inputs.espera }}
        run: |
          set -u
          MOTOR="https://api.github.com/repos/cesaryin/cy-elite-motor/actions/workflows"
          # LA URL DE SI MISMO SE DEDUCE, NO SE ESCRIBE (12-sep-2026).
          #
          # ESTO ROMPIO EL RELOJ Y COSTO UN DIA ENTERO DE AUTOMATIZACION. El
          # 11-sep el repo se renombro de cy-elite-picks a cy-elite-lab. Aqui
          # el nombre estaba escrito a mano, asi que a las 02:23 del dia
          # siguiente, al pasarse el testigo, la API respondio:
          #
          #     relevo de espera -> 307
          #
          # 307 es "eso se llama ahora de otra forma". curl SIN -L no sigue
          # redirecciones, asi que el POST se perdio, el testigo no llego y la
          # cadena murio ahi: ni picks, ni refrescos del LAB, ni capturas de
          # cuotas durante todo el dia. El workflow salio en VERDE.
          #
          # github.repository lo rellena GitHub con el nombre REAL del repo en
          # cada ejecucion. Vuelve a renombrarse y esto sigue funcionando.
          YO="https://api.github.com/repos/${{ github.repository }}/actions/workflows/reloj.yml/dispatches"
          A="Accept: application/vnd.github+json"
          PRESUPUESTO=$((5 * 3600))     # 5 h; el limite duro de un job son 6

          if [ -z "${TK:-}" ]; then
            echo "FALTA el secreto MOTOR_DISPATCH_TOKEN."
            echo "Crealo en Settings > Secrets and variables > Actions de este repo."
            exit 1
          fi

          # Horas objetivo, en MINUTOS DESDE LAS 13:00 UTC (= 8:00 AM CT).
          # Se cuenta asi para que la jornada no se parta a medianoche UTC.
          #   LAB  -> refresca proyecciones, alineaciones, clima y bullpen
          #   CAP  -> foto de las cuotas para el detector de movimiento (steam)
          #   RUN  -> los picks del dia. Va el PRIMERO, en el minuto 0 (8:00 AM
          #           CT). La hora se eligio con datos: el juego mas temprano de
          #           las ultimas 5 semanas empezo a las 11:15 AM CT, y a las
          #           9:22 ya estaban publicados los 9 abridores. A las 8:00 hay
          #           datos de sobra y quedan mas de 3 horas de margen, que con
          #           el CLV en -1.44 pp importa: cada hora que pasa, el mercado
          #           se ajusta y el precio empeora.
          TARGETS="
          0:picks.yml
          90:vigilante.yml
          215:cierre-captura.yml
          395:cierre-captura.yml
          580:cierre-captura.yml
          645:cierre-captura.yml
          730:cierre-captura.yml
          790:cierre-captura.yml
          "

          # El ancla de la jornada: las 13:00 UTC de hoy. Si ya cruzamos la
          # medianoche UTC pero seguimos en la misma jornada de beisbol, el ancla
          # es la de ayer.
          ANCLA=$(date -u -d "$(date -u +%F) 13:00:00" +%s)
          # EL FALLO QUE ROMPIA EL ENCENDIDO (encontrado el 4-sep-2026).
          # Aqui ponia "-lt 13". La intencion era buena: un reloj que despierta
          # de madrugada sigue en la jornada de AYER --el ultimo objetivo, el
          # minuto 790, cae a las 02:10 UTC-- y debe usar el ancla de ayer.
          # Pero los cron de encendido estan a las 12:35-12:58 UTC, y a esa hora
          # "-lt 13" TAMBIEN es cierto: el ancla se iba a ayer, el objetivo del
          # RUN quedaba 23 horas en el pasado y el reloj lo saltaba. Es decir:
          # aunque el cron entrara, la jornada no arrancaba. El unico cron que
          # llego en toda su historia lo hizo a las 17:02 --267 min tarde-- y por
          # eso funciono: para entonces ya habia pasado la 13:00.
          # El corte correcto es despues del ultimo objetivo (02:10 UTC), no
          # antes del ancla. Con 3 quedan 50 min de margen.
          if [ "$(date -u +%H)" -lt 3 ]; then ANCLA=$((ANCLA - 86400)); fi

          # LAS TANDAS DEL SISTEMA VIVO (14-sep-2026, decision de Cesar). El motor
          # calcula a las 8:00 las horas de las tandas del dia y las publica en
          # data/plan_tandas_<fecha>.json (src/vivo/plan.py). Aqui se pone un objetivo
          # "tanda" cada 10 minutos del 60 al 780; al llegar cada uno se lee ese
          # fichero y SOLO si el plan eligio ese minuto se lanza tanda.yml.
          # Los minutos 90, 580 y 730 no llevan objetivo de tanda: ya los ocupan el
          # vigilante y dos capturas, y con dos objetivos en el mismo minuto el reloj
          # da el segundo por pasado. El plan nunca los elige (RELOJ_FIJOS).
          JORNADA=$(date -u -d @$ANCLA +%F)
          PLAN_URL="https://raw.githubusercontent.com/${{ github.repository }}/master/data/plan_tandas_${JORNADA}.json"
          for M in $(seq 60 10 780); do
            case " 90 580 730 " in *" $M "*) continue ;; esac
            TARGETS="$TARGETS $M:tanda"
          done
          TARGETS=$(printf '%s\n' $TARGETS | sort -t: -k1,1n)

          INICIO=$(date +%s)
          echo "Arranca el reloj. Testigo recibido: ${DESDE:-0} min."

          # En modo espera este reloj no dispara nada: solo existe para llegar
          # vivo hasta el ancla de manana. Ver el bloque del final.
          if [ "${MODO_ESPERA:-0}" = "1" ]; then
            echo "Modo espera: sin objetivos, solo relevo hasta el ancla."
            TARGETS=""
          fi

          for T in $TARGETS; do
            MIN="${T%%:*}"
            WF="${T##*:}"
            [ "$MIN" -le "${DESDE:-0}" ] && continue

            OBJ=$((ANCLA + MIN * 60))
            AHORA=$(date +%s)
            if [ "$OBJ" -le "$AHORA" ]; then
              echo "  [$(date -u -d @$OBJ +%H:%M) UTC] $WF - ya paso, se salta"
              continue
            fi

            ESPERA=$((OBJ - AHORA))
            if [ $(( (AHORA - INICIO) + ESPERA )) -gt "$PRESUPUESTO" ]; then
              echo "El siguiente objetivo no cabe en este tramo. Paso el testigo en $((MIN - 1)) min."
              curl -sL -o /dev/null -w "  relevo -> %{http_code}\n" -X POST \
                -H "Authorization: Bearer $TK" -H "$A" "$YO" \
                -d "{\"ref\":\"master\",\"inputs\":{\"desde\":\"$((MIN - 1))\"}}"
              exit 0
            fi

            [ "$WF" = "tanda" ] || echo "  esperando $((ESPERA / 60)) min hasta $(date -u -d @$OBJ +%H:%M) UTC para $WF"
            sleep "$ESPERA"

            # EL BUCLE QUE MAREABA AL RELOJ. picks.yml, al terminar, despierta al
            # reloj para arrancar la jornada; eso esta bien cuando lo lanzas a
            # mano, pero si lo lanza el propio reloj se cierra el circulo
            # --reloj -> picks -> reloj-- y como aqui hay cancel-in-progress, el
            # reloj nuevo MATA al que estaba durmiendo. En el historial del 2-sep
            # se ven 9 arranques en "cancelled" por esto. Se corta diciendole al
            # RUN que no arranque nada: ya esta arrancado.
            #
            # OJO CON DONDE VA ESTO (arreglado el 3-sep-2026). Este bloque estaba
            # metido EN MEDIO de la continuacion del curl, entre la -H y la URL.
            # La barra de continuacion empalmaba con la primera linea de
            # comentario, asi que curl se quedaba SIN URL y moria con "no URL
            # specified". El reloj despertaba a su hora exacta, disparaba... y no
            # llegaba nada. Lo que vaya antes del curl, va AQUI, no ahi dentro.
            # UNA HORA POSIBLE DEL PLAN: una tanda, un refresco del LAB, o nada.
            if [ "$WF" = "tanda" ]; then
              PLAN=$(curl -sfL --retry 2 "$PLAN_URL?t=$(date +%s)" || true)
              if [ -n "$PLAN" ] && echo "$PLAN" | grep -qE "\"min_reloj\":${MIN}[,}]"; then
                curl -sL -o /dev/null -w "  $(date -u +%H:%M) UTC  tanda.yml (minuto $MIN) -> %{http_code}\n" -X POST \
                  -H "Authorization: Bearer $TK" -H "$A" \
                  "$MOTOR/tanda.yml/dispatches" \
                  -d "{\"ref\":\"main\",\"inputs\":{\"hora\":\"$MIN\",\"fecha\":\"$JORNADA\"}}"
              elif [ -n "$PLAN" ] && echo "$PLAN" | grep -q '"refrescos_lab"'; then
                if echo "$PLAN" | grep -qE "\"min_reloj_lab\":${MIN}[,}]"; then
                  curl -sL -o /dev/null -w "  $(date -u +%H:%M) UTC  lab-refresh.yml (plan, minuto $MIN) -> %{http_code}\n" -X POST \
                    -H "Authorization: Bearer $TK" -H "$A" \
                    "$MOTOR/lab-refresh.yml/dispatches" -d '{"ref":"main"}'
                fi
              else
                # SIN PLAN (o un plan sin refrescos): el LAB a sus horas de siempre.
                case " 140 320 500 680 " in
                  *" $MIN "*)
                    curl -sL -o /dev/null -w "  $(date -u +%H:%M) UTC  lab-refresh.yml (sin plan, minuto $MIN) -> %{http_code}\n" -X POST \
                      -H "Authorization: Bearer $TK" -H "$A" \
                      "$MOTOR/lab-refresh.yml/dispatches" -d '{"ref":"main"}' ;;
                esac
              fi
              continue
            fi

            CUERPO='{"ref":"main"}'
            if [ "$WF" = "picks.yml" ]; then
              CUERPO='{"ref":"main","inputs":{"arranca_reloj":"false"}}'
            fi

            curl -sL -o /dev/null -w "  $(date -u +%H:%M) UTC  $WF -> %{http_code}\n" -X POST \
              -H "Authorization: Bearer $TK" -H "$A" \
              "$MOTOR/$WF/dispatches" -d "$CUERPO"
          done

          echo "Jornada cubierta."

          # ------------------------------------------------------------------
          # EL RELOJ YA NO SE APAGA (4-sep-2026).
          #
          # POR QUE. Hasta hoy el reloj moria aqui y quien lo despertaba a la
          # mañana siguiente era un cron de GitHub. Medido sobre su historia
          # entera: 1 arranque por cron contra 16 a mano, y el 4-sep no entro
          # NINGUNO de los cuatro. Los objetivos, en cambio, salen con 0.0 min
          # de desvio. La conclusion es clara: dormir y disparar funciona; que
          # GitHub te despierte, no.
          #
          # QUE HACE AHORA. Antes de terminar, el reloj se asegura de que existe
          # su relevo: duerme hacia el ancla de mañana y, si no le cabe en el
          # presupuesto, pasa el testigo a otro reloj en modo espera que sigue
          # durmiendo. Al llegar el ancla arranca la jornada nueva con desde=0.
          # Es el MISMO mecanismo de relevo que ya funciona dentro del dia.
          #
          # POR QUE ES GRATIS. Este repo es publico, y los repos publicos tienen
          # minutos de Actions ilimitados. Un job dormido no cuesta nada.
          #
          # LOS CRON SE QUEDAN como red de seguridad: si un dia la cadena se
          # rompe, todavia hay cuatro oportunidades de que GitHub la reanude. Y
          # como el reloj nuevo cancela al viejo (cancel-in-progress), que entren
          # los dos no duplica nada.
          # ------------------------------------------------------------------
          SIG=$(date -u -d "$(date -u +%F) 13:00:00" +%s)
          while [ "$SIG" -le "$(date +%s)" ]; do SIG=$((SIG + 86400)); done
          ARRANQUE=$((SIG - 1500))          # 25 min antes: margen para el relevo

          AHORA=$(date +%s)
          CABE=$((PRESUPUESTO - (AHORA - INICIO)))
          FALTA=$((ARRANQUE - AHORA))
          echo "Siguiente jornada: $(date -u -d @$SIG +'%Y-%m-%d %H:%M') UTC."
          echo "  faltan $((FALTA / 60)) min y en este tramo caben $((CABE / 60))."

          if [ "$FALTA" -le 0 ]; then
            echo "  el ancla ya paso; arranco la jornada ahora mismo."
            curl -sL -o /dev/null -w "  jornada nueva -> %{http_code}\n" -X POST \
              -H "Authorization: Bearer $TK" -H "$A" "$YO" \
              -d '{"ref":"master","inputs":{"desde":"-1"}}'
          elif [ "$FALTA" -le "$CABE" ]; then
            echo "  duermo $((FALTA / 60)) min y arranco la jornada."
            sleep "$FALTA"
            curl -sL -o /dev/null -w "  jornada nueva -> %{http_code}\n" -X POST \
              -H "Authorization: Bearer $TK" -H "$A" "$YO" \
              -d '{"ref":"master","inputs":{"desde":"-1"}}'
          else
            echo "  no cabe: duermo lo que puedo y paso el testigo."
            sleep "$CABE"
            curl -sL -o /dev/null -w "  relevo de espera -> %{http_code}\n" -X POST \
              -H "Authorization: Bearer $TK" -H "$A" "$YO" \
              -d '{"ref":"master","inputs":{"desde":"-1","espera":"1"}}'
          fi
